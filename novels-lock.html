<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小说 · 需要密码</title>
<meta name="description" content="这一区需要密码。内容为化名写作的校园故事。" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f7f4ee" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f7f4ee'/%3E%3Cpath d='M8 7h16v3H11v12h13v3H8z' fill='%2335634b'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
  .lock { max-width: 380px; margin: 0 auto; }
  .lock form { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .lock input {
    font-family: var(--mono); font-size: 17px; letter-spacing: .34em; text-align: center;
    padding: 13px 14px; border: 1px solid var(--rule); background: var(--paper-3); color: var(--ink);
    border-radius: 0; outline: none; width: 100%;
  }
  .lock input:focus { border-color: var(--accent); }
  .lock button {
    padding: 12px; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font-family: var(--mono); font-size: 12px; letter-spacing: .22em; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .lock button:hover { background: var(--accent); color: var(--paper); }
  .lock .err { font-family: var(--mono); font-size: 12px; color: #b3391f; min-height: 18px; text-align: center; }
  [data-theme="dark"] .lock .err { color: #e2775a; }
</style>
</head>
<body>

<header class="head">
  <div class="wrap head-inner">
    <a class="brand" href="../"><b>deepseekv5</b><span>NOVELS</span></a>
    <nav class="nav" id="nav">
      <a href="../">个人主页</a>
      <a href="https://github.com/deepseekv5" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <div class="head-tools">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换深浅主题">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M5.2 18.8l1.4-1.4M17.4 6.6l1.4-1.4" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M20.5 13.2A8.6 8.6 0 1 1 10.8 3.5a7 7 0 0 0 9.7 9.7z"/></svg>
      </button>
      <button class="burger" id="burger" type="button" aria-label="菜单"><i></i></button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <div class="wrap">
      <h1 class="hero-title" style="font-size:clamp(34px,6vw,58px)">
        小说区
        <small>This area is locked</small>
      </h1>
    </div>
  </section>

  <section class="section" id="gate">
    <div class="wrap">
      <div class="entry">
        <div class="entry-side">
          <span class="label">Locked</span>
          <h3 class="entry-name">需要密码</h3>
          <dl class="entry-spec">
            <div><dt>状态</dt><dd>已加密访问</dd></div>
            <div><dt>作品</dt><dd>2 篇</dd></div>
            <div><dt>章节</dt><dd>共 6 章</dd></div>
          </dl>
        </div>
        <div class="entry-body">
          <p>
            这一区放的是两篇化名写作的校园故事，不对外公开。
            输入密码后进入，本机会记住解锁状态。
          </p>

          <div class="lock">
            <form id="lockForm" autocomplete="off">
              <label for="pwd" class="label" style="text-align:center">输入 4 位密码</label>
              <input id="pwd" type="password" inputmode="numeric" maxlength="4" placeholder="****" aria-label="密码" />
              <div class="err" id="lockErr" role="alert"></div>
              <button type="submit">进入</button>
            </form>
          </div>

          <p style="margin-top:22px;font-size:13px;color:var(--ink-3)">
            说明：这是静态站点，密码只做门槛、不做加密。页面对搜索引擎隐藏（noindex）。
          </p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot-note">
      <span>deepseekv5 · 小说区</span>
      <span>化名写作 · 全文虚构</span>
    </div>
  </div>
</footer>

<script>
  (function () {
    var root = document.documentElement;
    var key = 'd5-paper-theme';
    var saved = null;
    try { saved = localStorage.getItem(key); } catch (e) {}
    if (saved) root.dataset.theme = saved;
    var btn = document.getElementById('themeBtn');
    if (btn) btn.addEventListener('click', function () {
      var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem(key, next); } catch (e) {}
    });

    var form = document.getElementById('lockForm');
    var input = document.getElementById('pwd');
    var err = document.getElementById('lockErr');
    if (!form) return;

    // 已解锁则直接跳转
    try {
      if (localStorage.getItem('d5-novels') === '1') {
        location.replace('novels/index.html');
        return;
      }
    } catch (e) {}

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = (input.value || '').trim();
      if (v === '4732') {
        try { localStorage.setItem('d5-novels', '1'); } catch (e) {}
        err.textContent = '';
        location.href = 'novels/index.html';
      } else {
        err.textContent = '密码不对';
        input.value = '';
        input.focus();
      }
    });
  })();
</script>
</body>
</html>
