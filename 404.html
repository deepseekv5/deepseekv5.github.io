<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>页面跳转中… · deepseekv5</title>
<meta name="robots" content="noindex" />
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#06080f;color:#c9d4e8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{max-width:520px;padding:40px;text-align:center;line-height:1.8}
  a{color:#5ce1ff}
  .btn{display:inline-block;margin:8px;padding:10px 22px;border:1px solid #2a3350;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<div class="box" id="msg">正在跳转…</div>
<script>
(function () {
  var p = location.pathname;
  var prefixes = ['/map/', '/map-hall', '/model-hall', '/model', '/profile/', '/music',
    '/play', '/exp/', '/creator', '/create', '/tools', '/legacy', '/api-docs',
    '/box3', '/search', '/auth/'];
  var isMemorial = prefixes.some(function (x) { return p.indexOf(x) === 0; });
  if (isMemorial) {
    // 神岛方舟纪念站部署在 /shendao-ark/ 子路径下，这里补上前缀
    location.replace('https://deepseekv5.github.io/shendao-ark' + p + location.search + location.hash);
    return;
  }
  document.title = '页面未找到 · deepseekv5';
  document.getElementById('msg').innerHTML =
    '<div style="font-size:44px;margin-bottom:8px">404</div>' +
    '<p>这个页面不存在。</p>' +
    '<a class="btn" href="/">← 返回个人主页</a>' +
    '<a class="btn" href="/shendao-ark/">神岛方舟 · 纪念站</a>';
})();
</script>
</body>
</html>
